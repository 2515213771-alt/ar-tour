<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>游山城 · AR 实景导览</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  a-scene {
    position: fixed !important;
    top: 0; left: 0;
    width: 100vw !important;
    height: 100vh !important;
  }

  /* 开始遮罩：iOS 必须先由用户点击才能拿到摄像头与方向权限 */
  #gate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0d1b28 0%, #1b3a4b 60%, #2a1f1b 100%);
    color: #fff; text-align: center; padding: 28px;
  }
  #gate h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 1px; }
  #gate p { font-size: 13px; line-height: 1.8; opacity: .72; margin: 0 0 26px; max-width: 320px; }
  #startBtn {
    padding: 15px 44px; border: 0; border-radius: 999px;
    background: #ff4d3d; color: #fff; font-size: 16px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(255,77,61,.35);
  }
  #startBtn:active { transform: scale(.97); }

  /* 顶部状态条 */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 10px 14px calc(10px + env(safe-area-inset-top));
    color: #fff; font-size: 12px; line-height: 1.6;
    background: linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,0));
    pointer-events: none;
  }

  /* 到达提示 */
  #toast {
    position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
    z-index: 11; padding: 9px 18px; border-radius: 10px;
    background: rgba(255,77,61,.94); color: #fff; font-size: 13px;
    display: none; white-space: nowrap;
  }

  /* 点位按钮 + 面板 */
  #listBtn {
    position: fixed; right: 14px; bottom: calc(22px + env(safe-area-inset-bottom));
    z-index: 12; padding: 12px 20px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,.94); color: #111; font-size: 14px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
  }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 13;
    max-height: 62vh; overflow-y: auto;
    background: #fff; color: #222;
    border-radius: 18px 18px 0 0;
    padding: 18px 20px calc(30px + env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    -webkit-overflow-scrolling: touch;
  }
  #panel.open { transform: translateY(0); }
  #panel h2 { font-size: 16px; margin: 0 0 6px; }
  #panel .tip { font-size: 12px; color: #999; margin: 0 0 12px; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px;
  }
  .row:active { background: #fafafa; }
  .row .d { color: #999; font-size: 12px; font-variant-numeric: tabular-nums; }
  #detail { display: none; }
  #detail h2 { font-size: 17px; margin: 6px 0 10px; }
  #detail p { font-size: 14px; line-height: 1.9; color: #333; margin: 0; white-space: pre-line; }
  #back { display: inline-block; font-size: 13px; color: #ff4d3d; padding: 4px 0; }
</style>
</head>
<body>

<div id="gate">
  <h1>游山城 · AR 实景导览</h1>
  <p>请到室外开阔处，允许定位、摄像头、方向三项权限。<br>iOS 用 Safari，安卓用 Chrome，别在微信里直接打开。</p>
  <button id="startBtn">开始实景导览</button>
</div>

<div id="hud">等待授权…</div>
<div id="toast"></div>
<button id="listBtn">点位</button>

<div id="panel">
  <div id="list">
    <h2>附近点位</h2>
    <p class="tip">抬头看实景里的红牌，走近 50 米会自动提示</p>
    <div id="rows"></div>
  </div>
  <div id="detail">
    <span id="back">← 返回列表</span>
    <h2 id="dTitle"></h2>
    <p id="dText"></p>
  </div>
</div>

<!-- AR.js 3.4.7 位置版：必须锁版本号，勿用 master。
     主源 jsdelivr；如果页面白屏，把下面两个地址换成 unpkg 备用源：
     https://unpkg.com/@ar-js-org/ar.js@3.4.7/three.js/build/ar-threex-location-only.js
     https://unpkg.com/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

<script>
/* =========================================================
   1. 点位数据 —— 只改这里
   ---------------------------------------------------------
   lon / lat 可以直接填高德、腾讯地图长按取到的坐标，
   代码会用 gcj02ToWgs84() 自动纠偏（国内地图与 GPS 差 300~600m）。
   若你从 OpenStreetMap 取点（本身就是 WGS84），把 gcj02 改成 false。
   ⚠️ 下面是示例坐标，测试前务必换成你真实所在地的点位。
   ========================================================= */
const POIS = [
  {
    name: '解放碑', lon: 106.58300, lat: 29.55780, color: '#c7392b', gcj02: true,
    text: '抗战胜利纪功碑暨人民解放纪念碑，1947 年落成，高 27.5 米。它是重庆的城市原点，也是中国唯一一座纪念中华民族抗日战争胜利的纪念碑。'
  },
  {
    name: '洪崖洞', lon: 106.58340, lat: 29.56320, color: '#b4532a', gcj02: true,
    text: '依山就势的吊脚楼群，共 11 层，落差 75 米。白天是巴渝民居博物馆，入夜灯火倒映江面，被称为"现实版千与千寻"。'
  },
  {
    name: '朝天门', lon: 106.58900, lat: 29.56500, color: '#2b5f8c', gcj02: true,
    text: '长江与嘉陵江交汇处，重庆古城门中规模最大的一座。两江水色一清一浊，泾渭分明，是"两江四岸"的核心起点。'
  },
  {
    name: '李子坝', lon: 106.53360, lat: 29.55430, color: '#3a6b3a', gcj02: true,
    text: '轨道 2 号线穿楼而过，是中国第一座与商住楼共建共存的跨座式单轨车站。列车进站时整栋楼都在微微震动。'
  },
  {
    name: '鹅岭二厂', lon: 106.54900, lat: 29.55280, color: '#7a4b8a', gcj02: true,
    text: '原民国中央银行印钞厂，后为重庆印制二厂，如今是文创园区。老厂房肌理与涂鸦、咖啡馆混在一起，是重庆工业遗产改造的代表。'
  }
];

/* =========================================================
   2. 坐标纠偏：GCJ-02（高德/腾讯/微信）转 WGS-84（GPS）
   ========================================================= */
const PI = Math.PI, AXIS = 6378245.0, EE = 0.00669342162296594323;

function outOfChina(lng, lat) {
  return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
}
function transformLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLng(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
  return ret;
}
function gcj02ToWgs84(lng, lat) {
  if (outOfChina(lng, lat)) return [lng, lat];
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI;
  let magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((AXIS * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (AXIS / sqrtMagic * Math.cos(radLat) * PI);
  return [lng - dLng, lat - dLat];
}

/* =========================================================
   3. 中文标签纹理由 canvas 绘制（a-text 默认字体不支持中文）
   ========================================================= */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function makeLabelDataURL(name, color) {
  const W = 768, H = 192, R = 36;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  ctx.fillStyle = color;
  roundRect(ctx, 4, 4, W - 8, H - 8, R);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 7;
  roundRect(ctx, 4, 4, W - 8, H - 8, R);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  const size = name.length <= 3 ? 92 : name.length === 4 ? 80 : 68;
  ctx.font = '600 ' + size + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, W / 2, H / 2 + 2);

  return c.toDataURL('image/png');
}

/* =========================================================
   4. 工具：距离、朝向
   ========================================================= */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * PI / 180;
  const dLon = (lon2 - lon1) * PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * PI / 180) * Math.cos(lat2 * PI / 180) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

let headingVal = 0;
function bindOrientation() {
  const onOrient = (e) => {
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
      headingVal = e.webkitCompassHeading;
    } else if (e.absolute === true && e.alpha != null) {
      headingVal = (360 - e.alpha) % 360;
    } else if (e.alpha != null) {
      headingVal = (360 - e.alpha) % 360;
    }
  };
  window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);
}

/* =========================================================
   5. 页面状态
   ========================================================= */
let myLat = null, myLon = null, myAcc = null;
let lastToastPoi = -1;
const hudEl = document.getElementById('hud');
const toastEl = document.getElementById('toast');
const panelEl = document.getElementById('panel');
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const rowsEl = document.getElementById('rows');

function showToast(txt) {
  toastEl.textContent = txt;
  toastEl.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toastEl.style.display = 'none'; }, 3200);
}

function openPanel() {
  listEl.style.display = 'block';
  detailEl.style.display = 'none';
  panelEl.classList.add('open');
  renderRows();
}

function renderRows() {
  if (!rowsEl) return;
  rowsEl.innerHTML = POIS.map((p, i) => {
    const d = p._d;
    const label = (d == null) ? '待定位'
      : (d > 999 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m');
    return '<div class="row" data-i="' + i + '"><span>' + p.name +
           '</span><span class="d">' + label + '</span></div>';
  }).join('');
}

function renderHud() {
  const accTxt = myAcc == null ? '定位中…' : '精度 ' + Math.round(myAcc) + ' m';
  hudEl.innerHTML = accTxt + ' ｜ 朝向 ' + Math.round(headingVal) + '°' +
    (myLat != null
      ? '<br><span style="opacity:.7">' + myLat.toFixed(5) + ', ' + myLon.toFixed(5) + '</span>'
      : '');
}

function updateDistances() {
  if (myLat == null) return;
  let nearest = null;
  POIS.forEach((p, i) => {
    if (p._lat == null) return;
    const d = haversine(myLat, myLon, p._lat, p._lon);
    p._d = d;
    if (!nearest || d < nearest.d) nearest = { i: i, d: d };
  });
  renderRows();
  if (nearest && nearest.d < 50 && nearest.i !== lastToastPoi) {
    lastToastPoi = nearest.i;
    showToast('已到达：' + POIS[nearest.i].name);
  }
}

function startGpsWatch() {
  if (!navigator.geolocation) {
    hudEl.textContent = '此浏览器不支持定位';
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      myLat = pos.coords.latitude;
      myLon = pos.coords.longitude;
      myAcc = pos.coords.accuracy;
      renderHud();
      updateDistances();
    },
    (err) => {
      hudEl.textContent = '定位失败：' + err.message + '（请确认已开启定位并允许授权）';
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
  );
  setInterval(renderHud, 1000);
}

/* =========================================================
   6. 构建 AR 场景（必须放在用户点击之后，否则 iOS 拿不到权限）
   ========================================================= */
function addPois() {
  const root = document.getElementById('poiRoot');
  if (!root) return;

  POIS.forEach((p, idx) => {
    const pair = p.gcj02 ? gcj02ToWgs84(p.lon, p.lat) : [p.lon, p.lat];
    p._lon = pair[0];
    p._lat = pair[1];

    const dataUrl = makeLabelDataURL(p.name, p.color);

    // 外层：用经纬度锚定在真实世界
    const place = document.createElement('a-entity');
    place.setAttribute('gps-new-entity-place',
      'latitude: ' + p._lat + '; longitude: ' + p._lon);

    // 内层：牌子，y 是相对锚点的抬升高度，多层错开避免叠在一起
    const label = document.createElement('a-plane');
    label.setAttribute('width', 22);
    label.setAttribute('height', 5.5);
    label.setAttribute('position', { x: 0, y: 8 + (idx % 3) * 7, z: 0 });
    label.setAttribute('material',
      'shader: flat; src: ' + dataUrl + '; transparent: true; side: double; alphaTest: 0.05;');
    label.setAttribute('look-at', '[gps-new-camera]');

    place.appendChild(label);
    root.appendChild(place);
  });
}

function bootScene() {
  document.body.insertAdjacentHTML('beforeend', [
    '<a-scene embedded',
    '  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"',
    '  vr-mode-ui="enabled: false"',
    '  renderer="antialias: true; alpha: true">',
    '  <a-entity id="poiRoot"></a-entity>',
    '  <a-camera gps-new-camera="gpsMinDistance: 3; gpsMinAccuracy: 100"></a-camera>',
    '</a-scene>'
  ].join('\n'));

  const sceneEl = document.querySelector('a-scene');
  if (!sceneEl) return;
  if (sceneEl.hasLoaded) {
    addPois();
  } else {
    sceneEl.addEventListener('loaded', addPois);
    setTimeout(addPois, 1200); // 兜底：某些机型 loaded 事件不触发
  }
}

/* =========================================================
   7. 启动：先拿权限，再起场景
   ========================================================= */
document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '正在启动…';

  // iOS 13+ 必须用户手势内申请方向权限
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (e) { /* 用户拒绝方向权限，AR 仍可看画面但不会跟随朝向 */ }

  // 触发摄像头授权并立刻释放，避免和 AR.js 抢设备
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    tmp.getTracks().forEach(t => t.stop());
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '摄像头被拒绝，点此重试';
    document.getElementById('hud').textContent = '请在系统设置中允许该网址使用摄像头';
    return;
  }

  bindOrientation();
  bootScene();
  document.getElementById('gate').style.display = 'none';
  document.getElementById('hud').textContent = '启动中，请稍等 3~5 秒…';
  startGpsWatch();
});

/* =========================================================
   8. 面板交互
   ========================================================= */
document.getElementById('listBtn').addEventListener('click', () => {
  if (panelEl.classList.contains('open')) {
    panelEl.classList.remove('open');
  } else {
    openPanel();
  }
});

rowsEl.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const p = POIS[Number(row.dataset.i)];
  if (!p) return;
  document.getElementById('dTitle').textContent = p.name;
  const d = p._d;
  document.getElementById('dText').textContent = p.text +
    (d != null ? '\n\n距你约 ' + Math.round(d) + ' 米。' : '');
  listEl.style.display = 'none';
  detailEl.style.display = 'block';
  panelEl.scrollTop = 0;
});

document.getElementById('back').addEventListener('click', () => {
  detailEl.style.display = 'none';
  listEl.style.display = 'block';
});
</script>
</body>
</html>
